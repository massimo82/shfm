name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml, so a tag is never published without the same checks
  # that gate main.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Native runners for both release architectures, so what gets published
    # has been tested on the architecture it targets.
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      # The Go version comes from go.mod, the single place it is declared.
      # Dependencies are vendored, so the build needs no module downloads.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # MTP support is cgo (github.com/hanwen/usb -> libusb) and there is no
      # pure-Go fallback, so the base build needs the libusb headers and gcc.
      #
      # The archive tools are optional at run time, and the tests hide some
      # of them to simulate each kind of machine (internal/archive toolSets):
      # every one is installed so that no code path is left untested.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev \
            libarchive-tools 7zip xz-utils zstd bzip2 lzip lz4 jq

      # First-party code only: third_party/ is vendored upstream code.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l main.go internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # The cloud storage module (build tag "cloud") is pure Go: checked in
      # the same way, its own tests running against fake services.
      - name: go vet (cloud)
        run: go vet -tags cloud ./...

      - name: go test (cloud)
        run: go test -race -tags cloud ./...

      # The encrypted vaults module (build tag "vault") is pure Go too. Its
      # tests also recover vaults with the age command line tool, as
      # RECOVERY.txt tells users to: built at the version shfm uses (the
      # distribution's is too old for post-quantum keys).
      - name: Install age
        run: |
          go install filippo.io/age/cmd/age@v1.3.2
          echo "SHFM_TEST_AGE=$(go env GOPATH)/bin/age" >> "$GITHUB_ENV"

      - name: go vet (vault)
        run: go vet -tags vault ./...

      - name: go test (vault)
        run: go test -race -tags vault ./...

      # The LocalSend module (build tag "localsend") is pure Go: its tests
      # run two devices on the loopback interface, off the network.
      - name: go vet (localsend)
        run: go vet -tags localsend ./...

      - name: go test (localsend)
        run: go test -race -tags localsend ./...

      # The semantic (content search) variant is not built here: it needs the
      # llama-go static libraries, see README "Full build".
      - name: go build
        run: |
          go build -o shfm .
          go build -tags cloud -o shfm-cloud .
          go build -tags vault -o shfm-vault .
          go build -tags localsend -o shfm-localsend .
