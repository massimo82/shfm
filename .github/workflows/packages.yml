name: Packages

# The Arch, Debian/Ubuntu and Fedora packages: shfm with every feature
# (semantic search with Vulkan, cloud storage, desktop integration, GIO
# module), from
# contrib/arch/shfm, contrib/debian and contrib/rpm/shfm.spec, and the models
# for its semantic search, from contrib/arch/shfm-models*,
# contrib/debian-models and contrib/rpm/shfm-models.spec. Called by release.yml,
# which publishes them; run it by hand (Actions → Packages → Run workflow) to
# try the packaging on a branch, the packages are then left as the run's
# artifacts.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch:
    # Arch Linux has no official image for aarch64: x86_64 only
    name: arch (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v5

      # The PKGBUILD from its template: on a tag, with that release's source
      # archive on GitHub and its checksum, as it's published; otherwise
      # with an archive of the checked-out tree.
      - name: Write the PKGBUILD
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            contrib/arch/shfm/mkpkgbuild /build/shfm
          else
            version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)
            tar --exclude=.git --transform "s|^\.|shfm-$version|" \
              -czf "/tmp/shfm-$version.tar.gz" -C "$GITHUB_WORKSPACE" .
            contrib/arch/shfm/mkpkgbuild --local "/tmp/shfm-$version.tar.gz" /build/shfm
          fi

      # makepkg refuses to run as root; -s installs the PKGBUILD's
      # dependencies, so they are checked too
      - name: Set up a build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder /build

      - name: Build
        run: cd /build/shfm && sudo -u builder makepkg -s --noconfirm

      - name: Install and run
        run: |
          pacman -U --noconfirm /build/shfm/shfm-*.pkg.tar.zst
          getcap /usr/bin/shfm | grep -q cap_net_bind_service
          shfm --help

      - name: Collect
        run: |
          mkdir dist
          cp /build/shfm/shfm-*.pkg.tar.zst dist/
          (cd dist && for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done)
          # The PKGBUILD as built, for building it again (AUR, makepkg)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tar -czf dist/shfm-PKGBUILD.tar.gz -C /build shfm/PKGBUILD shfm/shfm.install
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: package-arch
          path: dist/*
          if-no-files-found: error

  arch-models:
    name: arch models
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5

      - name: Set up a build user
        run: |
          useradd -m builder
          mkdir /build
          cp -r contrib/arch/shfm-models contrib/arch/shfm-models-4b /build/
          chown -R builder /build

      # -d: they depend on shfm, built by the other job
      - name: Build shfm-models
        run: |
          cd /build/shfm-models && sudo -u builder makepkg -d --noconfirm
          tar -tf shfm-models-*.pkg.tar | grep -x usr/share/shfm/models/Qwen3-Embedding-0.6B-Q8_0.gguf
          tar -tf shfm-models-*.pkg.tar | grep -x usr/share/shfm/models/Qwen3-Reranker-0.6B-Q4_K_M.gguf

      # Too large for a release asset: only its PKGBUILD is published, and
      # its downloads are checked here
      - name: Check shfm-models-4b's sources
        run: |
          cd /build/shfm-models-4b && sudo -u builder makepkg --verifysource
          rm -f *.gguf

      - name: Collect
        run: |
          mkdir dist
          cp /build/shfm-models/shfm-models-*.pkg.tar dist/
          (cd dist && for f in *.pkg.tar; do sha256sum "$f" > "$f.sha256"; done)
          tar -czf dist/shfm-models-PKGBUILD.tar.gz -C contrib/arch shfm-models/PKGBUILD
          tar -czf dist/shfm-models-4b-PKGBUILD.tar.gz -C contrib/arch shfm-models-4b/PKGBUILD

      - uses: actions/upload-artifact@v4
        with:
          name: package-arch-models
          path: dist/*
          if-no-files-found: error

  debian:
    # Built on Ubuntu 24.04: installs there and on later releases, and on
    # Debian 13 and later.
    name: debian (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      # Ubuntu's golang-go is older than go.mod asks for: Go comes from here,
      # hence dpkg-buildpackage -d below.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev \
            g++ cmake curl pkgconf libusb-1.0-0-dev libglib2.0-dev \
            libvulkan-dev glslc spirv-headers

      - name: Build
        run: |
          contrib/fetch-llama-go.sh
          cp -r contrib/debian debian
          dpkg-buildpackage -b -us -uc -d

      - name: Install and run
        run: |
          sudo apt-get install -y ../shfm_*.deb
          getcap /usr/bin/shfm | grep -q cap_net_bind_service
          shfm --help

      - name: Collect
        run: |
          mkdir dist
          cp ../shfm_*.deb dist/
          (cd dist && for f in *.deb; do sha256sum "$f" > "$f.sha256"; done)

      - uses: actions/upload-artifact@v4
        with:
          name: package-debian-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  debian-models:
    name: debian models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev curl ca-certificates

      - name: Build
        run: |
          cp -r contrib/debian-models debian
          dpkg-buildpackage -b -us -uc

      # --force-depends: they depend on shfm, built by the other job.
      # shfm-models-4b downloads its models when installed, and removes them
      # when removed.
      - name: Install and remove
        run: |
          M=/usr/share/shfm/models
          sudo dpkg --force-depends -i ../shfm-models-4b_*_all.deb
          ls -l $M
          test -f $M/Qwen3-Embedding-4B-Q8_0.gguf && test -f $M/Qwen3-Reranker-0.6B-Q4_K_M.gguf
          sudo dpkg --force-depends -r shfm-models-4b
          test ! -e $M
          sudo dpkg --force-depends -i ../shfm-models_*_all.deb
          test -f $M/Qwen3-Embedding-0.6B-Q8_0.gguf && test -f $M/Qwen3-Reranker-0.6B-Q4_K_M.gguf
          sudo dpkg --force-depends -r shfm-models

      - name: Collect
        run: |
          mkdir dist
          cp ../shfm-models_*_all.deb ../shfm-models-4b_*_all.deb dist/
          (cd dist && for f in *.deb; do sha256sum "$f" > "$f.sha256"; done)

      - uses: actions/upload-artifact@v4
        with:
          name: package-debian-models
          path: dist/*
          if-no-files-found: error

  fedora:
    # Built on Fedora 44: installs there and on later releases
    name: fedora (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install tools
        run: dnf -y install git tar rpm-build rpmdevtools

      - uses: actions/checkout@v5

      # The source archive is the checked-out tree, as the release's own
      # archive would be; llama-go and llama.cpp are the spec's downloads
      - name: Get the sources
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)
          sources=$(rpm --eval '%{_sourcedir}')
          mkdir -p "$sources"
          tar --exclude=.git --transform "s|^\.|shfm-$version|" \
            -czf "$sources/shfm-$version.tar.gz" -C "$GITHUB_WORKSPACE" .
          spectool -g -R -s 1,2 contrib/rpm/shfm.spec

      - name: Build
        run: |
          dnf -y builddep contrib/rpm/shfm.spec
          rpmbuild -ba contrib/rpm/shfm.spec

      - name: Install and run
        run: |
          dnf -y install "$(rpm --eval '%{_rpmdir}')"/*/shfm-*.rpm
          getcap /usr/bin/shfm | grep -q cap_net_bind_service
          shfm --help

      - name: Collect
        run: |
          mkdir dist
          cp "$(rpm --eval '%{_rpmdir}')"/*/shfm-*.rpm dist/
          # The source package once, from the x86_64 build
          if [ "${{ matrix.arch }}" = x86_64 ]; then cp "$(rpm --eval '%{_srcrpmdir}')"/shfm-*.src.rpm dist/; fi
          (cd dist && for f in *.rpm; do sha256sum "$f" > "$f.sha256"; done)

      - uses: actions/upload-artifact@v4
        with:
          name: package-fedora-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  fedora-models:
    name: fedora models
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install tools
        run: dnf -y install git tar rpm-build rpmdevtools curl

      - uses: actions/checkout@v5

      - name: Build
        run: |
          spectool -g -R contrib/rpm/shfm-models.spec
          rpmbuild -bb contrib/rpm/shfm-models.spec

      # --nodeps: they depend on shfm, built by the other job.
      # shfm-models-4b downloads its models when installed, and removes them
      # when removed.
      - name: Install and remove
        run: |
          R=$(rpm --eval '%{_rpmdir}')/noarch
          M=/usr/share/shfm/models
          rpm -i --nodeps $R/shfm-models-4b-*.rpm
          ls -l $M
          test -f $M/Qwen3-Embedding-4B-Q8_0.gguf && test -f $M/Qwen3-Reranker-0.6B-Q4_K_M.gguf
          rpm -e --nodeps shfm-models-4b
          test ! -e $M
          rpm -i --nodeps $R/shfm-models-1-*.rpm
          test -f $M/Qwen3-Embedding-0.6B-Q8_0.gguf && test -f $M/Qwen3-Reranker-0.6B-Q4_K_M.gguf
          rpm -e --nodeps shfm-models

      - name: Collect
        run: |
          mkdir dist
          cp "$(rpm --eval '%{_rpmdir}')"/noarch/*.rpm dist/
          (cd dist && for f in *.rpm; do sha256sum "$f" > "$f.sha256"; done)

      - uses: actions/upload-artifact@v4
        with:
          name: package-fedora-models
          path: dist/*
          if-no-files-found: error
